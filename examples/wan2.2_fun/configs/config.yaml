# Main config for Wan2.2-Fun ViDiT-Q quantization pipeline

# Model paths (adjust to your setup)
model_path: "./models/Wan2.2-Fun-14B-InP"  # or Wan2.1-Fun-14B-InP, etc.
model_type: "t2v"  # 't2v' or 'i2v'

# VAE
vae_path: null  # if null, loaded from model_path

# Text encoder
text_encoder_path: null  # if null, loaded from model_path

# PTQ config file
ptq_config: "./configs/w8a8.yaml"

# Video generation settings
num_frames: 81
height: 480
width: 832
fps: 16

# Inference settings
num_inference_steps: 50
guidance_scale: 5.0
dtype: "bf16"
seed: 42

# Prompt settings
prompt_path: "./prompts.txt"
batch_size: 1

# Output
save_dir: "./output"
